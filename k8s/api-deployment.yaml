apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-contador
spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-contador

  template:
    metadata:
      labels:
        app: api-contador

    spec:
      containers:
        - name: api-contador
          image: poc-contador-api:latest
          imagePullPolicy: Never
          env:
            - name: DB_NOME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DB_USUARIO
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_SENHA
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            
          ports:
            - containerPort: 8081
          
